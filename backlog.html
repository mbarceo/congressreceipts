<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Every member of Congress by state and chamber, and which ones have a tracker so far.">
<title>Backlog Queue · Congress Receipts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css?v=86652562">
<link rel="stylesheet" href="hub.css?v=91a2553f">
<style>
.skipbox{margin:0 0 18px;padding:10px 14px;border:1px solid var(--line,#2a2f36);border-radius:8px}.skipbox summary{cursor:pointer;font-weight:600}.skiptbl{border-collapse:collapse;margin-top:10px}.skiptbl th,.skiptbl td{padding:4px 14px 4px 0;text-align:left}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.ctl{display:flex;flex-direction:column;gap:12px}
.ctl input[type=search]{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font:inherit;min-height:44px;width:100%;max-width:420px}
.ctl .filters{align-items:center}
.ctl .filters .eyebrow{margin-right:4px}
.chip-btn{min-height:36px}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.88rem}
.stats b{font-family:var(--f-mono);font-weight:500}
.state{display:flex;flex-direction:column;gap:14px}.state>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:12px}.state>summary::-webkit-details-marker{display:none}.state>summary::before{content:'▸';color:var(--muted)}.state[open]>summary::before{content:'▾'}.state>summary h2{flex:1;margin:0}.bulk{display:flex;gap:8px;margin:0 0 12px}
.state h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.state h2 .mono{color:var(--muted);font-weight:400}
.grp h3{margin-bottom:6px}
.m{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.m>*{min-width:0}
.nm{font-family:var(--f-display);font-weight:700;font-size:.98rem}
.sub{color:var(--muted);font-size:.78rem;font-family:var(--f-mono);margin-top:2px}
.pt{display:inline-block;min-width:18px;text-align:center;border-radius:4px;padding:0 5px;margin-right:6px}
.pt.D{background:var(--la-soft);color:var(--la)} .pt.R{background:var(--bad-bg);color:var(--bad)} .pt.I{background:var(--flag-bg);color:var(--flag)}
a.pill{text-decoration:none}
a.pill:hover{text-decoration:underline}
.empty{color:var(--muted)}
</style>
</head>
<body data-page="backlog">
<div class="wrap hub">
  <header>
    <span class="eyebrow">119th Congress · Who's next</span>
    <h1>Backlog Queue</h1>
    <p class="lede">Every current member of Congress, by state and chamber, and where each one stands on getting a tracking page. Finished trackers link to the live site.</p>
    <div class="stats" id="stats"></div>
  </header>
  <div class="ctl">
    <input id="q" type="search" placeholder="Search name or state" aria-label="Search by name or state">
    <div class="filters" id="f-ch" role="group" aria-label="Chamber"><span class="eyebrow">Chamber</span></div>
    <div class="filters" id="f-party" role="group" aria-label="Party"><span class="eyebrow">Party</span></div>
    <div class="filters" id="f-status" role="group" aria-label="Status"><span class="eyebrow">Status</span></div>
  </div>
  <div class="bulk"><button type="button" class="chip-btn" id="expand">Expand all</button><button type="button" class="chip-btn" id="collapse">Collapse all</button></div>
  <details class="skipbox" id="skipbox"><summary>Why some members are skipped</summary><div id="skipstats"></div></details>
  <main class="view" id="list"></main>
</div>
<script>
const LABELS={todo:['Not started','s-none'],progress:['In progress','s-progress'],done:['Live','s-delivered'],skip:['Skipped','s-stalled']};
const REASONS={retiring:'Retiring','lost-primary':'Lost their primary','other-office':'Running for another office','lost-general':'Lost the Nov 3 general','lost-senate-bid':'Lost a U.S. Senate bid','not-on-ballot':'Not on the Nov 3 ballot'};
const OPEN=new Set();
const F={ch:'all',party:'all',status:'all'};
let data=[],queue={};
const info=id=>queue[id]||{status:'todo'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function chips(id,key,opts){
  const el=document.getElementById(id);
  opts.forEach(([v,t])=>{const b=document.createElement('button');b.type='button';b.className='chip-btn';b.textContent=t;b.dataset.v=v;
    b.setAttribute('aria-pressed',v==='all');
    b.onclick=()=>{F[key]=v;el.querySelectorAll('.chip-btn').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
    el.appendChild(b)});
}
chips('f-ch','ch',[['all','All'],['Senate','Senate'],['House','House']]);
chips('f-party','party',[['all','All'],['D','Democrat'],['R','Republican'],['I','Independent']]);
chips('f-status','status',[['all','All'],['done','Live'],['progress','In progress'],['todo','Not started'],['skip','Skipped']]);

function pill(id){
  const i=info(id),[l,c]=LABELS[i.status]||LABELS.todo;
  if(i.status==='skip'&&REASONS[i.reason])return `<span class="pill ${c}">${l}: ${REASONS[i.reason]}</span>`;
  return i.url?`<a class="pill ${c}" href="${esc(i.url)}" target="_blank" rel="noopener">${l} ↗</a>`:`<span class="pill ${c}">${l}</span>`;
}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const rows=data.filter(r=>(F.ch==='all'||r.chamber===F.ch)&&(F.party==='all'||r.party===F.party)&&(F.status==='all'||info(r.bioguide).status===F.status)&&(!q||(r.name+' '+r.state_name+' '+r.state).toLowerCase().includes(q)));
  const by=new Map();rows.forEach(r=>{if(!by.has(r.state_name))by.set(r.state_name,[]);by.get(r.state_name).push(r)});
  let h='';
  const filtering=!!q||F.ch!=='all'||F.party!=='all'||F.status!=='all';
  for(const [name,list] of by){
    const n={};list.forEach(r=>{const k=info(r.bioguide).status;n[k]=(n[k]||0)+1});
    const sum=['done','progress','skip'].filter(k=>n[k]).map(k=>`${n[k]} ${LABELS[k][0].toLowerCase()}`).join(' · ');
    h+=`<details class="state" data-s="${esc(name)}"${filtering||OPEN.has(name)?' open':''}><summary><span class="eyebrow">${list[0].state}</span><h2>${esc(name)}<span class="mono">${list.length} shown${sum?' · '+sum:''}</span></h2></summary>`;
    for(const c of ['Senate','House']){
      const g=list.filter(r=>r.chamber===c);if(!g.length)continue;
      h+=`<div class="grp"><h3>${c==='Senate'?'U.S. Senate':'U.S. House'}</h3>`;
      for(const r of g){
        const d=r.district==null?'Class '+r.senate_class:r.district===0?'At-large':'District '+r.district;
        h+=`<div class="m"><div><div class="nm">${esc(r.name)}</div><div class="sub"><span class="pt ${r.party}">${r.party}</span>${d} · term ends ${r.term_end.slice(0,4)}</div></div>${pill(r.bioguide)}</div>`;
      }
      h+='</div>';
    }
    h+='</details>';
  }
  document.getElementById('list').innerHTML=h||'<p class="empty">No members match.</p>';
  const cnt={};data.forEach(r=>{const s=info(r.bioguide).status;cnt[s]=(cnt[s]||0)+1});
  document.getElementById('stats').innerHTML=`<span><b>${rows.length}</b> shown of ${data.length}</span>`+['done','progress','todo'].map(k=>`<span>${LABELS[k][0]} <b>${cnt[k]||0}</b></span>`).join('');
}
function skipStats(){
  const t={};data.forEach(r=>{const i=info(r.bioguide);if(i.status!=='skip'||!REASONS[i.reason])return;(t[i.reason]=t[i.reason]||{D:0,R:0,I:0})[r.party]++});
  const keys=Object.keys(REASONS).filter(k=>t[k]);
  if(!keys.length){document.getElementById('skipbox').hidden=true;return}
  const tot={D:0,R:0,I:0};
  const row=(l,c,b)=>`<tr><td>${l}</td><td>${c.D}</td><td>${c.R}</td><td>${c.I}</td><td><b>${c.D+c.R+c.I}</b></td></tr>`;
  keys.forEach(k=>['D','R','I'].forEach(p=>tot[p]+=t[k][p]));
  document.getElementById('skipstats').innerHTML=`<p class="sub">Members of the 119th Congress who are not expected in the 120th (Jan 2027) and have no tracker. Source: Ballotpedia, as of Nov 24, 2026. General-election results for everyone else are not yet confirmed.</p><table class="skiptbl"><thead><tr><th>Reason</th><th>Dem</th><th>Rep</th><th>Ind</th><th>Total</th></tr></thead><tbody>${keys.map(k=>row(REASONS[k],t[k])).join('')}${row('All skipped',tot)}</tbody></table>`;
}
document.getElementById('list').addEventListener('click',e=>{const sm=e.target.closest('summary');if(!sm)return;const d=sm.parentElement;if(d.dataset.s)setTimeout(()=>{d.open?OPEN.add(d.dataset.s):OPEN.delete(d.dataset.s)})});
const bulk=o=>{document.querySelectorAll('#list details.state').forEach(d=>{d.open=o;o?OPEN.add(d.dataset.s):OPEN.delete(d.dataset.s)})};
document.getElementById('expand').onclick=()=>bulk(true);
document.getElementById('collapse').onclick=()=>bulk(false);
document.getElementById('q').addEventListener('input',render);
Promise.all([fetch('data/congress.json').then(r=>r.json()),fetch('data/queue.json').then(r=>r.json())]).then(([d,qu])=>{data=d;queue=qu;render();skipStats()});
</script>
<script src="hub.js?v=6d7921b8"></script>
</body>
</html>
